version: 1
metadata:
  name: Passwordless Authentication Flow
entries:
  - identifiers:
      pk: cb02dab7-1cd2-406f-9c3a-05b6f0a98ef0
      slug: passwordless-authentication-flow
    id: flow-passwordless
    model: authentik_flows.flow
    attrs:
      name: Passwordless Authentication Flow
      title: Sign in with passkey
      designation: authentication
      authentication: require_unauthenticated
      compatibility_mode: false
      denied_action: message_continue
      layout: stacked
      policy_engine_mode: any

  - identifiers:
      name: passwordless-authentication-webauthn-validate
    id: webauthn-validate-stage
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      webauthn_user_verification: required
      last_auth_threshold: seconds=0
      webauthn_allowed_device_types: []

  - identifiers:
      name: passwordless-authentication-login
    id: login-stage
    model: authentik_stages_user_login.userloginstage
    attrs:
      session_duration: seconds=0
      geoip_binding: no_binding
      network_binding: no_binding
      remember_device: days=30
      remember_me_offset: seconds=0
      terminate_other_sessions: false

  - identifiers:
      target: !KeyOf flow-passwordless
      stage: !KeyOf webauthn-validate-stage
      order: 10
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true

  - identifiers:
      target: !KeyOf flow-passwordless
      stage: !KeyOf login-stage
      order: 20
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: false
      invalid_response_action: retry
      policy_engine_mode: any
      re_evaluate_policies: true
